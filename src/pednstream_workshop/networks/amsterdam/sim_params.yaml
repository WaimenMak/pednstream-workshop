# =====================================================================
#  "Amsterdam: Centraal to Museumplein": challenge network for PedNStream
#  GENERATED by tools/build_amsterdam.py straight from the OpenStreetMap
#  walking network (© OpenStreetMap contributors). Edit that script, not this file.
# =====================================================================
#
#  112 nodes and 124 corridors: the streets on the 5 routes PedNStream finds
#  on the full street map, which has every walkable street within 650 m of the line
#  Stationsplein - Museumplein (349 nodes, 656 corridors). Nobody can walk anywhere
#  else, so the other streets are only drawn (other_streets.json), not simulated.
#  Main places that no route passes are nodes without corridors, so they keep their number.
#  The adjacency matrix is in adj_matrix.npy and the corridor lengths (measured along OSM)
#  are in edge_distances.pkl. Main places:
#     0 Centraal Station
#     1 Stationsplein
#     2 Dam (Madame Tussauds)
#     3 Spui
#     4 Muntplein
#     5 Leidseplein
#     6 Rembrandtplein
#     7 Weteringcircuit
#     8 Rijksmuseum
#     9 Museumplein
#
#  Widths are 'effective' walking widths: the OSM width tag, or a default per street type,
#  with the street and its sidewalks between the same two junctions added up. Damrak
#  (past Madame Tussauds) is set to 20 m on purpose.
#  The paths into Museumplein (an open square) are at least 10 m.
# =====================================================================

network:
  origin_nodes: [0]
  destination_nodes: [9]

simulation:
  seed: 42
  simulation_steps: 720  # 720 x 10 s = 2 hours
  unit_time: 10
  assign_flows_type: "classic"
  od_tracking: true      # each person keeps their destination (OD pair) all the way
  path_finder:
    k_paths: 5             # up to 5 routes ...
    diverse_paths: true    # ... that really differ (see diverse_paths in the workshop package)
    temp: 5
    alpha: 1
    beta: 2
    omega: 1
    std_dev: 0

default_link:
  length: 50
  width: 3
  free_flow_speed: 1.34   # m/s, a typical free walking speed
  k_critical: 2
  k_jam: 6
  gamma: 0.01

